name: deploy

# Deploys code to the Azure resources created by infra/bicep (which is applied once, by hand, with deploy.sh).
# Signs in with OIDC through the user-assigned identity `id-<name>-deploy`; no Azure secret is stored in GitHub.
# Manual only: the resources cost money while they exist.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_NOLOGO: "1"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: publish API
        run: dotnet publish src/DocAssistant.Api -c Release -o out/api
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: out/api
      - name: publish Function
        run: dotnet publish src/DocAssistant.Functions -c Release -o out/func
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: out/func
      - name: build web
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.API_URL }}
          VITE_AUTH_MODE: entra
          VITE_ENTRA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.API_SCOPE }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
      - name: smoke test
        run: |
          curl -fsS "${VARS_API_URL}/healthz"
          curl -fsS "${VARS_API_URL}/readyz"
        env:
          VARS_API_URL: ${{ vars.API_URL }}
