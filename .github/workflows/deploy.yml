name: deploy

# Deploys code to the Azure resources created by infra/bicep (which is applied once, by hand, with deploy.sh).
# Signs in with OIDC through the user-assigned identity `id-<name>-deploy`; no Azure secret is stored in GitHub.
# Manual only: the resources cost money while they exist.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_NOLOGO: "1"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: publish API
        run: dotnet publish src/DocAssistant.Api -c Release -o out/api
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: out/api
      - name: publish Function
        run: dotnet publish src/DocAssistant.Functions -c Release -o out/func
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: out/func
      - name: build web
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.API_URL }}
          VITE_AUTH_MODE: entra
          VITE_ENTRA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.API_SCOPE }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
      - name: smoke test
        run: |
          curl -fsS "${VARS_API_URL}/healthz"
          curl -fsS "${VARS_API_URL}/readyz"
        env:
          VARS_API_URL: ${{ vars.API_URL }}
