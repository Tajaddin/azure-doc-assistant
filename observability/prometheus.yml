global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: docassistant-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: docassistant-worker
    static_configs:
      - targets: ["worker:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
